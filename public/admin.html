<script>
// The owner's page: approve contractors, watch requests, and track lead fees. Locked by the ADMIN_KEY you set in Vercel.
var app = document.getElementById('app'), D = null, tab = 'todo', toastT, editing = null, removing = null;
var SETUP = null, REC = null, FIL = { trade: '', county: '', stage: 'open', q: '' }, picked = {}, IMPORT = null, NOTE = '';
var KEY = ''; try { KEY = sessionStorage.getItem('adminKey') || ''; } catch (e) {}
function toast(m) { var el = document.getElementById('toast'); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3500); }
async function call(body, qs) {
  var res = await fetch('/api/admin' + (qs || ''), { method: body ? 'POST' : 'GET', cache: 'no-store', headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY }, body: body ? JSON.stringify(body) : undefined });
  var data = await res.json().catch(function () { return {}; });
  if (!res.ok) throw Object.assign(new Error(data.error || 'Something went wrong.'), { status: res.status });
  return data;
}
var when = function (iso) { return iso ? new Date(iso).toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; };
var money = function (n) { return '$' + Number(n || 0).toLocaleString('en-US'); };
var tradeNames = function (c) { return c.trades.map(function (t) { return (SITE.trades[t] || { name: t }).name; }).join(', '); };
var table = function (heads, rows, empty) { return rows.length ? '<div class="tablewrap"><table class="list"><thead><tr>' + heads.map(function (h) { return '<th scope="col">' + h + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>' : '<p class="sub">' + empty + '</p>'; };
var statusPill = function (c) {
  if (c.status === 'pending') return '<span class="pill wait">Waiting on you</span>';
  if (c.status === 'paused') return '<span class="pill bad">Paused by you</span>';
  if (!c.setup_complete) return '<span class="pill wait">Approved, setup not finished</span>';
  return c.self_paused ? '<span class="pill plain">Approved, paused themselves</span>' : '<span class="pill ok">Approved</span>';
};
var statePill = function (r) {
  if (r.state === 'canceled') return '<span class="pill plain">Canceled by customer</span>';
  if (r.state === 'matched') return '<span class="pill ok">Matched</span>';
  if (!r.alerted) return '<span class="pill bad">No one to alert</span>';
  if (r.state === 'open') return '<span class="pill wait">' + (r.accepted ? r.accepted + ' said yes' : 'Waiting') + '</span>';
  return '<span class="pill plain">Closed, ' + (r.accepted ? 'not chosen' : 'no answer') + '</span>';
};
var contractorRow = function (c) {
  if (editing === c.id) return editRow(c);
  var acts = (c.status === 'approved' ? '<button class="btn sm ghost" type="button" data-status="paused" data-id="' + c.id + '">Pause</button>'
    : '<button class="btn sm" type="button" data-status="approved" data-id="' + c.id + '">Approve</button>') + '<button class="btn sm ghost" type="button" data-edit="' + c.id + '">Edit</button>';
  return '<tr><td><b>' + esc(c.company) + '</b><br><span class="sub">' + esc(c.contact || '') + ' · ' + esc(c.email) + ' · ' + esc(c.mobile) + '</span><br><span class="sub small">Applied ' + when(c.created_at) + (c.source ? ' · from ' + esc(c.source) : '') + '</span></td>' +
    '<td>' + esc(tradeNames(c)) + '<br><span class="sub">License ' + esc(c.license) + '</span></td>' +
    '<td>' + esc(c.counties.join(', ')) + '</td>' +
    '<td class="num">' + (c.visit_fee == null ? '<span class="sub">Not set</span>' : money(c.visit_fee)) + '<br><span class="sub small">' + esc(SITE.alertHours[c.alert_hours] || '') + '</span></td>' +
    '<td class="num">' + (c.reviews ? c.reviews.avg + ' of 5<br><span class="sub small">' + c.reviews.count + ' review' + (c.reviews.count === 1 ? '' : 's') + '</span>' : '<span class="sub">None yet</span>') + '</td>' +
    '<td class="num">' + (c.owed ? '<b>' + money(c.owed) + '</b>' : '<span class="sub">$0</span>') + '<br><span class="sub small">' + c.free_leads_left + ' free left</span></td>' +
    '<td>' + statusPill(c) + '<div class="acts" style="margin-top:6px">' + acts + '</div></td></tr>';
};
// Edit what a contractor can't change themselves (company, license, trades, counties, business phone).
var boxes = function (name, all, on, label) { return '<div class="chips">' + all.map(function (k) { return '<label class="chip" for="' + name + k.replace(/\W/g, '') + '"><input type="checkbox" id="' + name + k.replace(/\W/g, '') + '" name="' + name + '" value="' + esc(k) + '"' + (on.indexOf(k) > -1 ? ' checked' : '') + '><span>' + esc(label ? label(k) : k) + '</span></label>'; }).join('') + '</div>'; };
var editRow = function (c) {
  return '<tr><td colspan="7"><form class="stack" id="editc" data-id="' + c.id + '"><div class="row"><div><label for="ec">Company</label><input type="text" id="ec" value="' + esc(c.company) + '"></div><div><label for="el">License number(s)</label><input type="text" id="el" value="' + esc(c.license) + '"></div></div>' +
    '<div class="row"><div><label for="ep">Business phone</label><input type="tel" id="ep" value="' + esc(c.business_phone || '') + '"></div><div></div></div>' +
    '<div><label>Trades</label>' + boxes('et', Object.keys(SITE.trades), c.trades, function (k) { return SITE.trades[k].name; }) + '</div>' +
    '<div><label>Counties</label>' + boxes('eco', SITE.counties, c.counties) + '</div>' +
    '<div class="btns"><button class="btn sm" type="submit">Save</button><button class="btn sm ghost" type="button" data-noedit>Cancel</button></div></form></td></tr>';
};
var CHEADS = ['Company', 'Trade and license', 'Counties', 'Visit fee', 'Reviews', 'Owes', 'Status'];
var requestRow = function (r) {
  var svc = (SITE.services[r.service] || { name: '' }).name, prob = (SITE.problems[r.problem] || [r.problem])[0];
  return '<tr><td class="num">' + when(r.created_at) + '</td><td><b>' + esc(prob) + '</b><br><span class="sub">' + esc(svc) + ' · ' + esc(r.timing) + '</span></td>' +
    '<td>' + esc(r.county) + ' ' + esc(r.zip) + '</td>' +
    '<td>' + esc(r.name) + '<br><span class="sub">' + esc(r.phone) + ' · ' + esc(r.email) + '</span>' + (r.source ? '<br><span class="sub small">from ' + esc(r.source) + '</span>' : '') + '</td>' +
    '<td>' + statePill(r) + '<br><span class="sub small">' + r.alerted + ' alerted' + (r.first_yes_min != null ? ' · first yes in ' + r.first_yes_min + ' min' : '') + (r.reopened ? ' · sent out again after a no-show' : '') + (r.cancel_reason ? ' · ' + esc(r.cancel_reason) : '') + (r.photos ? ' · ' + r.photos + ' photo' + (r.photos === 1 ? '' : 's') : '') + (r.chosen ? ' · chose ' + esc(r.chosen) : '') + '</span></td>' +
    '<td>' + (r.rating ? '<b>' + r.rating + ' of 5</b>' + (r.review_hidden ? ' <span class="pill plain">Hidden</span>' : '') + (r.showed_up === false ? ' <span class="pill bad">No-show</span>' : '') + (r.review ? '<br><span class="sub small">' + esc(r.review) + '</span>' : '') + '<br><button class="quiet" type="button" data-hide="' + r.id + '" data-hidden="' + (r.review_hidden ? 'false' : 'true') + '">' + (r.review_hidden ? 'Show review' : 'Hide review') + '</button>' : '<span class="sub">None</span>') + '</td>' +
    '<td><a href="/status?t=' + encodeURIComponent(r.token) + '">Open</a>' + (r.state === 'canceled' ? '' : '<br><button class="quiet" type="button" data-remove="' + r.id + '">' + (removing === r.id ? 'Sure? Remove it' : 'Remove (spam)') + '</button>') + '</td></tr>';
};
var RHEADS = ['When', 'Problem', 'Where', 'Customer', 'Outcome', 'Review', 'Page'];

// One lead fee: what happened, and the buttons that apply to it.
var RESULT = { done: 'Pro: job done', canceled: 'Pro: customer canceled', no_contact: 'Pro: couldn\'t reach customer' };
var FHEADS = ['When', 'Contractor', 'Fee', 'What happened', 'Status', ''];
var feeRow = function (f) {
  var what = [f.no_show ? 'Customer reported no-show' : '', RESULT[f.job_result] || ''].filter(Boolean).join('. ') || 'Job won';
  var status = f.fee_review ? '<span class="pill bad">Needs your decision</span>' : f.paid_at ? '<span class="pill ok">Paid ' + when(f.paid_at) + '</span>' : f.lead_fee ? '<span class="pill wait">Owed</span>' : '<span class="pill plain">Waived</span>';
  var acts = f.fee_review ? '<button class="btn sm ghost" type="button" data-fee="waive" data-id="' + f.id + '">Waive</button><button class="btn sm" type="button" data-fee="keep" data-id="' + f.id + '">Keep fee</button>'
    : f.paid_at ? '<button class="btn sm ghost" type="button" data-fee="unpaid" data-id="' + f.id + '">Undo</button>'
    : f.lead_fee ? '<button class="btn sm" type="button" data-fee="paid" data-id="' + f.id + '">Mark paid</button><button class="btn sm ghost" type="button" data-fee="waive" data-id="' + f.id + '">Waive</button>' : '';
  return '<tr><td class="num">' + when(f.at) + '</td><td><b>' + esc(f.company) + '</b></td><td class="num">' + money(f.lead_fee) + '</td><td>' + esc(what) + '</td><td>' + status + '</td><td><div class="acts">' + acts + '</div></td></tr>';
};
// ---- Launch checklist: every outside service the site needs, checked live ----
var STATE = { ok: ['ok', 'Ready'], warn: ['wait', 'Check'], bad: ['bad', 'Fix this'] };
function setupTab() {
  if (!SETUP) { loadSetup(); return '<p class="sub">Checking your services. This takes a few seconds...</p>'; }
  var groups = [], h = '';
  SETUP.checks.forEach(function (c) { if (groups.indexOf(c.group) < 0) groups.push(c.group); });
  h += '<div class="split"><p class="sub">' + (SETUP.bad ? '<b>' + SETUP.bad + ' to fix</b> before real customers use the site. ' : '<b>Nothing blocking launch.</b> ') + SETUP.warn + ' to check, ' + SETUP.ok + ' ready. Checked ' + when(SETUP.checked_at) + '.</p><button class="btn sm ghost" type="button" data-recheck>Check again</button></div>';
  groups.forEach(function (g) {
    h += '<h2>' + esc(g) + '</h2><div class="checklist">' + SETUP.checks.filter(function (c) { return c.group === g; }).map(function (c) {
      return '<div class="chk ' + c.state + '"><span class="pill ' + STATE[c.state][0] + '">' + STATE[c.state][1] + '</span><div><b>' + esc(c.label) + '</b><p>' + esc(c.detail) + '</p>' + (c.fix ? '<p class="fix">' + esc(c.fix) + '</p>' : '') + '</div></div>';
    }).join('') + '</div>';
  });
  h += '<h2>Prove it works</h2><p class="sub">Checks can pass while mail still lands in spam. These send real messages so you can see them arrive.</p><div class="testgrid">' +
    '<form class="card" id="t-email"><h3>Send a test email</h3><div><label for="te">To</label><input type="email" id="te" value="' + esc(SETUP.test_to.email) + '"></div><div><button class="btn sm" type="submit">Send test email</button></div></form>' +
    '<form class="card" id="t-text"><h3>Send a test text</h3><div><label for="tt">Mobile number</label><input type="tel" id="tt" placeholder="(908) 555-0123"></div><div><button class="btn sm" type="submit">Send test text</button></div></form>' +
    '<form class="card" id="t-alert"><h3>Send me a sample job alert</h3><p class="small sub">Exactly what a pro gets for a new request, with a made-up job. Nothing is saved.</p><div><label for="ae">Email</label><input type="email" id="ae" value="' + esc(SETUP.test_to.email) + '"></div><div><label for="ap">Mobile for the text version (optional)</label><input type="tel" id="ap"></div><div><button class="btn sm" type="submit">Send sample alert</button></div></form></div>';
  return h;
}
async function loadSetup() {
  try { SETUP = await call(null, '?view=setup'); } catch (x) { SETUP = { checks: [{ group: 'Checklist', label: 'Could not run the checks', state: 'bad', detail: x.message, fix: '' }], bad: 1, warn: 0, ok: 0, checked_at: new Date().toISOString(), test_to: { email: '' } }; }
  if (tab === 'setup' || tab === 'todo') render();
}

// ---- Recruiting: where you're thin, your list of companies, and invites ----
var STAGE = { new: ['plain', 'Not invited'], invited: ['wait', 'Invited'], clicked: ['info', 'Clicked the link'], applied: ['ok', 'Applied'], approved: ['ok', 'Approved'], live: ['ok', 'Live'], not_interested: ['plain', 'Not interested'], unsubscribed: ['bad', 'Asked for no emails'] };
var tname = function (t) { return (SITE.trades[t] || { name: t }).name; };
function shown() {
  return REC.prospects.filter(function (p) {
    if (FIL.trade && p.trades.indexOf(FIL.trade) < 0) return false;
    if (FIL.county && p.counties.indexOf(FIL.county) < 0) return false;
    if (FIL.stage === 'open' && ['new', 'invited', 'clicked'].indexOf(p.stage) < 0) return false;
    if (FIL.stage === 'ready' && p.blocked) return false;
    if (FIL.stage && ['open', 'ready'].indexOf(FIL.stage) < 0 && p.stage !== FIL.stage) return false;
    if (FIL.q) { var q = FIL.q.toLowerCase(); if ([p.company, p.contact, p.email, p.phone, p.town, p.notes].join(' ').toLowerCase().indexOf(q) < 0) return false; }
    return true;
  });
}
function cell(county, t) {
  var x = REC.supply[county][t], tone = x.live >= 3 ? 'ok' : x.live ? 'thin' : 'none', on = FIL.county === county && FIL.trade === t;
  return '<td><button type="button" class="cell ' + tone + (on ? ' on' : '') + '" data-cell="' + esc(county) + '|' + t + '" aria-label="' + esc(county) + ', ' + esc(tname(t)) + ': ' + x.live + ' live">' +
    '<b>' + x.live + '</b><span>' + (x.pending ? x.pending + ' waiting, ' : '') + x.prospects + ' to invite' + (x.gaps ? '</span><em>' + x.gaps + ' missed</em>' : '</span>') + '</button></td>';
}
function recruitTab() {
  if (!REC) { loadRecruit(); return '<p class="sub">Loading your recruiting list...</p>'; }
  var T = REC.totals, list = shown(), sel = list.filter(function (p) { return picked[p.id]; }), ready = sel.filter(function (p) { return !p.blocked; });
  var h = '<div class="kpis"><div><b>' + T.prospects + '</b><span>companies on your list</span></div><div><b>' + T.invited + '</b><span>invited</span></div><div><b>' + T.clicked + '</b><span>clicked the link</span></div><div><b>' + T.applied + '</b><span>applied</span></div><div><b>' + T.live + '</b><span>now live</span></div></div>';
  // Supply map
  h += '<h2>Where you need pros</h2><p class="sub">Live pros in each county, by trade. Aim for at least 3 so every homeowner gets choices. Red means nobody, so requests there go unanswered. Tap a box to see who you can invite there.</p>' +
    '<div class="tablewrap"><table class="list supply"><thead><tr><th scope="col">County</th>' + REC.trades.map(function (t) { return '<th scope="col">' + esc(tname(t)) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    SITE.counties.map(function (c) { return '<tr><th scope="row">' + esc(c) + '</th>' + REC.trades.map(function (t) { return cell(c, t); }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
    '<p class="small sub">"Waiting" = applied but not approved or not set up yet. "Missed" = requests in the last 30 days with nobody to alert.</p>';
  // Add companies
  h += '<h2>Add companies to invite</h2><div class="testgrid">' + importCard() +
    '<form class="card" id="invite"><h3>Invite one after a call</h3><p class="small sub">They get a sign-up link with their email filled in. It\'s added to your list so you can see if they sign up.</p>' +
    '<div class="row"><div><label for="iname">Their name or company</label><input type="text" id="iname"></div><div><label for="iemail">Their email</label><input type="email" id="iemail"></div></div>' +
    '<div class="row"><div><label for="itrade">Trade</label><select id="itrade">' + REC.trades.map(function (t) { return '<option value="' + t + '">' + esc(tname(t)) + '</option>'; }).join('') + '</select></div><div><label for="icounty">County</label><select id="icounty"><option value="">Not sure</option>' + SITE.counties.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select></div></div>' +
    '<div><button class="btn sm" type="submit">Send invite</button></div></form></div>';
  // The list
  h += '<h2 id="plist">Your list</h2>' +
    '<div class="filters"><select id="f-trade" aria-label="Trade"><option value="">All trades</option>' + Object.keys(SITE.trades).map(function (t) { return '<option value="' + t + '"' + (FIL.trade === t ? ' selected' : '') + '>' + esc(tname(t)) + '</option>'; }).join('') + '</select>' +
    '<select id="f-county" aria-label="County"><option value="">All counties</option>' + SITE.counties.map(function (c) { return '<option' + (FIL.county === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
    '<select id="f-stage" aria-label="Status">' + [['open', 'Not signed up yet'], ['ready', 'Ready to invite now'], ['', 'Everyone'], ['applied', 'Applied'], ['live', 'Live'], ['not_interested', 'Not interested'], ['unsubscribed', 'Asked for no emails']].map(function (o) { return '<option value="' + o[0] + '"' + (FIL.stage === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<input type="search" id="f-q" placeholder="Search name, email, town" value="' + esc(FIL.q) + '" aria-label="Search"></div>';
  if (!REC.can_bulk) h += '<div class="notice warn"><b>Bulk invites are off until you add your mailing address.</b> Set MAILING_ADDRESS in Vercel, or mailingAddress in public/assets/config.js. The law (CAN-SPAM) requires a postal address in emails to companies that haven\'t signed up. A PO box works.</div>';
  h += '<div class="bulk"><span class="sub">' + list.length + ' shown, ' + sel.length + ' picked' + (sel.length > ready.length ? ' (' + (sel.length - ready.length) + ' can\'t be emailed now)' : '') + '</span>' +
    '<button class="quiet" type="button" data-pickall>' + (list.length && list.every(function (p) { return picked[p.id]; }) ? 'Unpick all' : 'Pick all shown') + '</button>' +
    '<input type="text" id="note" maxlength="400" value="' + esc(NOTE) + '" placeholder="Optional line at the top of the email, like where you met them" aria-label="Optional note for the invite email">' +
    '<button class="btn sm" type="button" data-bulk' + (REC.can_bulk && ready.length ? '' : ' disabled') + '>Invite ' + (ready.length || '') + (ready.length > 100 ? ' (first 100)' : '') + '</button></div>';
  h += table(['', 'Company', 'Trade and county', 'Status', ''], list.slice(0, 300).map(prospectRow), REC.prospects.length ? 'Nobody matches these filters.' : 'Your list is empty. Add companies above.');
  if (list.length > 300) h += '<p class="small sub">Showing the first 300. Narrow it with the filters.</p>';
  return h;
}
function prospectRow(p) {
  var st = STAGE[p.stage] || ['plain', p.stage];
  return '<tr><td><input type="checkbox" data-pick="' + p.id + '"' + (picked[p.id] ? ' checked' : '') + ' aria-label="Pick ' + esc(p.company) + '"></td>' +
    '<td><b>' + esc(p.company) + '</b><br><span class="sub">' + esc([p.contact, p.email, p.phone].filter(Boolean).join(' · ')) + '</span>' + (p.notes ? '<br><span class="sub small">' + esc(p.notes) + '</span>' : '') + (p.list_name ? '<br><span class="sub small">From ' + esc(p.list_name) + '</span>' : '') + '</td>' +
    '<td>' + esc(p.trades.map(tname).join(', ') || 'Trade not set') + '<br><span class="sub">' + esc(p.counties.join(', ') || 'County not set') + (p.town ? ' · ' + esc(p.town) : '') + '</span></td>' +
    '<td><span class="pill ' + st[0] + '">' + st[1] + '</span>' + (p.invite_count ? '<br><span class="sub small">Invited ' + p.invite_count + 'x, last ' + when(p.invited_at) + '</span>' : '') + (p.blocked && ['new', 'invited', 'clicked'].indexOf(p.stage) >= 0 ? '<br><span class="sub small">' + esc(p.blocked) + '</span>' : '') + '</td>' +
    '<td>' + (['applied', 'approved', 'live', 'unsubscribed'].indexOf(p.stage) >= 0 ? '' : '<button class="quiet" type="button" data-noint="' + p.id + '" data-val="' + (p.stage !== 'not_interested') + '">' + (p.stage === 'not_interested' ? 'Undo' : 'Not interested') + '</button>') + '</td></tr>';
}
async function loadRecruit() {
  try { REC = await call(null, '?view=recruit'); } catch (x) { toast(x.message); REC = null; return; }
  if (tab === 'recruit') render();
}

// ---- Adding a list: paste from a spreadsheet or pick a CSV file. Columns are matched by their names. ----
var FIELDS = { company: /^(company|business|business name|company name|name|dba)$/, contact: /^(contact|owner|contact name|first name|full name|person)$/, email: /e-?mail/, phone: /phone|mobile|cell|tel/,
  website: /web|url|site/, license: /licen[cs]e/, town: /^(town|city|municipality|locality)$/, county: /county/, zip: /^(zip|zip code|postal|postal code|zipcode)$/, trade: /trade|category|type|service|industry/, notes: /note|comment/ };
function parseTable(text) {
  text = String(text || '').replace(/^﻿/, '');
  var first = text.split(/\r?\n/)[0] || '', sep = first.split('\t').length > first.split(',').length ? '\t' : ',';
  var rows = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"' && cur === '') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(function (c) { return c.trim(); })) rows.push(row); row = []; }
    else cur += ch;
  }
  row.push(cur); if (row.some(function (c) { return c.trim(); })) rows.push(row);
  return rows;
}
var PLACES = null;
function countyOf(r) {
  if (r.county) { var c = r.county.replace(/\s*county\s*$/i, '').trim().toLowerCase(); var hit = SITE.counties.filter(function (x) { return x.toLowerCase() === c; })[0]; if (hit) return hit; }
